<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EKAIA Puerto | Iniciar Sesion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['DM Sans', 'sans-serif'] },
                    colors: { brand: { 400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488' } }
                }
            }
        }
    </script>
    <style>
        .animated-gradient {
            background: linear-gradient(-45deg, #0f172a, #1e3a5f, #134e4a, #0f172a);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .glass {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-field {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .input-field:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #14b8a6;
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.2);
        }
        .btn-primary {
            background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
            transition: all 0.3s ease;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(20, 184, 166, 0.3); }
        .shake { animation: shake 0.5s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body class="animated-gradient min-h-screen font-sans flex items-center justify-center p-4">
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-0 right-0 w-96 h-96 bg-brand-500/10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-0 left-0 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl"></div>
    </div>
    
    <div class="relative w-full max-w-md">
        <div class="glass rounded-3xl p-8 shadow-2xl">
            <div class="text-center mb-8">
                <img src="/static/logo_ekaia.png" alt="EKAIA" class="h-16 mx-auto mb-4">
                <h1 class="text-2xl font-bold text-white mb-1">Bienvenido</h1>
                <p class="text-white/60 text-sm">Sistema de Control Vehicular - Puerto de Iquique</p>
            </div>
            
            <div id="error-container" class="hidden mb-6">
                <div class="flex items-center gap-3 p-4 rounded-xl bg-red-500/20 border border-red-500/30">
                    <i data-lucide="alert-circle" class="w-5 h-5 text-red-400"></i>
                    <p class="text-sm text-red-400" id="error-message"></p>
                </div>
            </div>
            
            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-white/70 mb-2">Usuario o Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-lucide="user" class="w-5 h-5 text-white/40"></i>
                        </div>
                        <input type="text" id="username" class="input-field w-full pl-12 pr-4 py-3 rounded-xl text-white placeholder-white/40 outline-none" placeholder="Ingrese su usuario" required>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-white/70 mb-2">Contrasena</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-lucide="lock" class="w-5 h-5 text-white/40"></i>
                        </div>
                        <input type="password" id="password" class="input-field w-full pl-12 pr-12 py-3 rounded-xl text-white placeholder-white/40 outline-none" placeholder="Ingrese su contrasena" required>
                        <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-4 flex items-center text-white/40 hover:text-white/70">
                            <i data-lucide="eye" class="w-5 h-5" id="eye-icon"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" id="submit-btn" class="btn-primary w-full py-3.5 rounded-xl text-white font-semibold flex items-center justify-center gap-2">
                    <span id="btn-text">Iniciar Sesion</span>
                    <i data-lucide="arrow-right" class="w-5 h-5" id="btn-icon"></i>
                    <svg id="btn-spinner" class="hidden w-5 h-5 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </form>
            
            <div class="mt-8 pt-6 border-t border-white/10 text-center">
                <p class="text-xs text-white/40">Sistema protegido. Acceso solo para personal autorizado.</p>
            </div>
        </div>
        
        <div class="mt-6 text-center">
            <a href="https://seidev.cl" target="_blank" class="inline-flex items-center gap-2 text-white/40 hover:text-white/60">
                <span class="text-xs">Desarrollado por</span>
                <img src="/static/logo_seidev.png" alt="SEIDEV" class="h-6 opacity-60 hover:opacity-100">
            </a>
        </div>
    </div>
    
    <script>
        lucide.createIcons();
        
        const form = document.getElementById('login-form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('toggle-password');
        const eyeIcon = document.getElementById('eye-icon');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const btnSpinner = document.getElementById('btn-spinner');
        const errorContainer = document.getElementById('error-container');
        const errorMessage = document.getElementById('error-message');
        
        toggleBtn.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            eyeIcon.setAttribute('data-lucide', type === 'password' ? 'eye' : 'eye-off');
            lucide.createIcons();
        });
        
        function showError(msg) {
            errorMessage.textContent = msg;
            errorContainer.classList.remove('hidden');
            errorContainer.classList.add('shake');
            setTimeout(() => errorContainer.classList.remove('shake'), 500);
        }
        
        function setLoading(loading) {
            submitBtn.disabled = loading;
            btnText.textContent = loading ? 'Ingresando...' : 'Iniciar Sesion';
            btnIcon.classList.toggle('hidden', loading);
            btnSpinner.classList.toggle('hidden', !loading);
        }
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorContainer.classList.add('hidden');
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            
            if (!username || !password) {
                showError('Complete todos los campos');
                return;
            }
            
            setLoading(true);
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                    credentials: 'include'
                });
                
                const data = await res.json();
                
                if (data.success) {
                    window.location.href = '/';
                } else {
                    showError(data.message || 'Error al iniciar sesion');
                }
            } catch (err) {
                showError('Error de conexion');
            } finally {
                setLoading(false);
            }
        });
        
        // Verificar sesion existente
        fetch('/api/auth/validate', { credentials: 'include' })
            .then(res => { if (res.ok) window.location.href = '/'; })
            .catch(() => {});
        
        usernameInput.focus();
    </script>
</body>
</html>
